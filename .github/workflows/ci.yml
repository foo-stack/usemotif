name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope: every job here only reads the checkout to
# typecheck / lint / build / test - none push, comment, or release.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # The desktop-electron example carries Electron as a dev dependency. This
    # required lane never launches it, so skip the ~150 MB binary download -
    # only the (non-required) Desktop workflow needs the real binary.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      # Bundle-size budgets - fails CI if any package's gzipped
      # `dist/index.js` exceeds the budget in `.size-limits.json`.
      # Run `yarn size:update` locally to rebaseline after a real
      # growth event (and explain the change in the PR).
      - name: Bundle size budgets
        run: yarn size

      # Import-cost guardrail - fails CI if a single named import
      # from a motif package balloons unexpectedly (signals broken
      # tree-shaking or a barrel-export with side effects).
      - name: Tree-shaking check
        run: yarn treeshake

      # Packs every publishable package and reads the manifest back out of the
      # tarball, failing if a Yarn `workspace:` range survived into it. Those
      # strings make a package uninstallable, and a published version cannot be
      # amended - so this has to fail here rather than on the registry.
      - name: Publish manifest check
        run: yarn verify:publish

      # Reads the resolved type of a style prop in a fixture that augments
      # `MotifCustomTheme`, and fails when the token paths are missing. The
      # failure it guards is silent: a prop's value union keeps `(string & {})`
      # so every raw CSS value still compiles, which means a severed
      # augmentation channel produces no error anywhere: the editor just stops
      # suggesting, and nothing else here would notice. Needs `dist`, so it runs
      # after Build.
      - name: Token type check
        run: yarn tokens:check

      # Holds the public claims to their recorded evidence. The README, the
      # landing page and the docs each carry claims about what motif does, and
      # about libraries this project does not control. This fails when the copy
      # moves without the ledger, when a claim known to be wrong is still on the
      # page unanswered, or when a cited path, symbol or command stops holding.
      # Every one of those drifts silently: the page still reads fine.
      - name: Public claims check
        run: yarn claims:check

      # MDX is not typechecked, so a mistyped component prop reaches the browser
      # unchallenged. One mistyped word shipped four documentation pages blank
      # for months, and the visual baselines recorded the blank pages as the
      # expected result. The component no longer crashes on an unknown Callout
      # variant, which means the failure is now silent rather than loud: it
      # renders as a neutral note and loses the severity the page intended.
      - name: Callout variant check
        run: yarn callout:check

      # Two documentation failures that a build cannot catch, because an example
      # in a guide is never executed: showing `require()` for a package that
      # publishes no require condition, and naming one config file two ways on
      # one page. Both have already shipped once.
      - name: Docs ESM consistency
        run: yarn docs-esm:check

      # Every public export has to appear in some docs page's `covers:`
      # frontmatter, and every `covers:` entry has to still be exported. Read
      # from the built type declarations, so it runs after Build. The exports
      # that were undocumented when the check arrived are recorded in
      # `scripts/docs-coverage-gaps.json`, and that list may only shrink.
      - name: Docs coverage check
        run: yarn docs-coverage:check

      # The writing rule bans the em dash, the en dash and the ellipsis
      # character. Removing four thousand of them once was a sweep; this is what
      # makes it a rule. A character standing alone inside quotes is allowed,
      # because that is a symbol rather than punctuation: the indeterminate mark
      # on a checkbox, the elision in a code sample.
      - name: Writing check
        run: yarn writing:check

  # Committed Playwright PNGs for the docs site. A separate job, not another
  # step in `verify`, for two reasons: it needs a browser download the other
  # lanes do not, and it must run on macOS because the baselines are recorded
  # there. Snapshot pixels are platform-specific, so running the same PNGs on
  # ubuntu would fail on font rendering alone.
  #
  # This gate went unrun for three months while the baselines drifted, because
  # a prototype-comparison suite sharing its test directory made it impossible
  # to pass. That suite now has its own config, so this is green and can gate.
  visual:
    name: visual baselines (docs)
    runs-on: macos-latest

    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # `vorge preview` serves the built output, and the docs dogfood motif, so
      # the workspace packages have to exist before the site can build.
      - name: Build packages
        run: yarn build

      - name: Install Chromium
        run: yarn workspace @usemotif/docs exec playwright install --with-deps chromium

      # `visual-check` builds the site itself. That is deliberate: `vorge
      # preview` serves whatever is in `dist/`, and Playwright reuses an
      # existing server, so running the check without a fresh build compares
      # the committed PNGs against whatever output happened to be lying around.
      # That is not hypothetical, it is how the first version of these
      # baselines was recorded against the wrong branch's content.
      - name: Visual check
        run: yarn workspace @usemotif/docs visual-check

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/docs/test-results/
          retention-days: 7

  visual-uikit:
    name: visual baselines (uikit)
    runs-on: macos-latest

    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # The uikit's `build` is `storybook build`, so filtering on it with its
      # dependencies builds the workspace packages and a fresh storybook-static.
      # The visual spec reads the story list from that build's index.json, and
      # Playwright reuses whatever server is up, so a stale build would compare
      # baselines against the wrong stories.
      - name: Build packages and Storybook
        run: yarn turbo run build --filter=@usemotif/uikit...

      - name: Install Chromium
        run: yarn workspace @usemotif/uikit exec playwright install --with-deps chromium

      - name: Visual check
        run: yarn workspace @usemotif/uikit visual-check

      # On a failure (including the first run, before baselines exist) this
      # carries the rendered PNGs, which are what new baselines are taken from.
      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-uikit-renders
          path: apps/uikit/test-results/
          retention-days: 7
