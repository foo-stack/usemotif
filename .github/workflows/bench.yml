name: Bench

# Performance regression gate, kept separate from the required `CI` workflow on
# purpose: benchmarks are noisier and slower than unit tests, so this lane runs
# alongside CI without blocking merges until the team is confident it is stable
# (do not add it to branch-protection required checks yet).
#
# - web-bench runs automatically and IS a real gate: it asserts the
#   cross-library throughput ratios (motif vs Tamagui) stay above their floors.
#   Ratios are machine-independent, so they hold across GitHub runners.
# - device-bench is manual-only (workflow_dispatch). On-device frame timing
#   needs a built native app and a device cloud; until that is wired (see
#   benchmarks/rn-startup/README.md) the MEASUREMENT steps are a documented
#   scaffold and this job is never part of PR checks. The regression GATE the
#   lane would run (scripts/check-device-bench.mjs) IS implemented and is
#   self-tested against a fixture in web-bench on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_device:
        description: 'Also run the experimental on-device lane (needs the native project + device cloud)'
        type: boolean
        default: false

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: this lane measures and reports; it never pushes or comments.
permissions:
  contents: read

jobs:
  web-bench:
    name: web bench (jsdom ratio gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # The benches import the built `@usemotif/*` packages (their `dist/`), so
      # build before running - a fresh checkout has no `dist/`.
      - name: Build packages
        run: yarn build

      # Runs the data-table suite and fails if any motif-vs-Tamagui ratio
      # drops below the floor in benchmarks/.bench-budgets.json. A breach
      # means motif regressed or the baseline closed the gap - both warrant a
      # look. Rebaseline deliberately with `yarn bench:check --update`.
      - name: Ratio regression gate
        run: yarn bench:check

      # The ratios the docs benchmark page publishes, recorded on this runner. The page renders
      # the committed benchmarks/results.json; this copy is for comparing against it. The lane is
      # read-only, so it never commits the file.
      - name: Record the published ratios
        run: node scripts/bench-report.mjs --out "$RUNNER_TEMP/bench-results.json"

      - name: Upload the recorded ratios
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench-results.json

      # Self-test the on-device startup gate against a labelled fixture (NOT
      # real device data) so the gate logic is exercised on every push. The
      # measurement needs hardware; the regression check does not. The device
      # lane below reuses this exact script on its real emitted JSON.
      - name: On-device startup gate (self-test against fixture)
        run: yarn bench:device-gate

  device-bench:
    name: device bench (manual, experimental)
    # Manual-only and opt-in. Never runs on push/PR, so it can never block a
    # merge. Flip the run_device input when dispatching to exercise it.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Provable today: the startup fixture compiles against the shipped
      # react-native package. This guards the fixture from bit-rot even before
      # the device lane below is wired.
      - name: Typecheck the startup fixture
        run: yarn workspace @usemotif-bench/rn-startup typecheck

      # ── Device measurement - scaffold ────────────────────────────────
      # The MEASUREMENT steps below are the intended on-device lane. They are
      # commented because they require artefacts this repo does not yet carry: a
      # built native app (the rn-startup fixture is a source fixture, not an Expo
      # project) and a device cloud or hosted simulator. The methodology -
      # Hermes runtimeInit → bundleLoaded deltas, motif vs plain-RN baseline,
      # ~50ms budget - is documented in benchmarks/rn-startup/README.md, and the
      # emitted-JSON schema + the GATE that consumes it
      # (scripts/check-device-bench.mjs) already exist and are self-tested in
      # web-bench. Uncomment and fill in once the native project + cloud are
      # available; the gate step at the end then runs unchanged.
      #
      # - name: Install Maestro
      #   run: curl -Ls https://get.maestro.mobile.dev | bash
      #
      # - name: Boot iOS simulator
      #   run: xcrun simctl boot "iPhone 15"
      #
      # - name: Build the release app
      #   run: # eas build / expo run:ios on the generated startup project
      #
      # - name: Run the startup flow, capture timings, write the results JSON
      #   run: # maestro test ... → benchmarks/rn-startup/results/device-latest.json
      #        # (schema: benchmarks/rn-startup/README.md)
      #
      # - name: Gate on the motif-vs-baseline startup delta
      #   run: node scripts/check-device-bench.mjs --results benchmarks/rn-startup/results/device-latest.json
      - name: Device measurement not yet wired
        run: |
          echo "On-device measurement is a documented manual methodology (needs"
          echo "a built native app + simulator/device cloud). See"
          echo "benchmarks/rn-startup/README.md for setup, and the commented"
          echo "scaffold above for the intended CI steps. The regression GATE"
          echo "(scripts/check-device-bench.mjs) is implemented + self-tested in"
          echo "web-bench; it runs unchanged once the measurement emits its JSON."
